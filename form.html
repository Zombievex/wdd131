<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="WDD 131 – Dynamic Web Fundamentals, Colby Orr, this is a submission form for the week 05 assignment">
    <meta name="author" content="Colby Orr">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
    <title>WDD 131 – Dynamic Web Fundamentals – Colby Orr</title>
</head>
<body>
    <header>
        <h1>
            Product Review
        </h1>
    </header>
    <main>
      <form method="get" action="review.html">

        <select id="product" name="product">
          <option value="">Choose a Product...</option>
      </select>

        <label class="review-description">Overall Rating</label>

        <div class="rating">

          <div class="rating-option">
            <input type="radio" id="rating1" name="rating" value="1">
            <label for="rating1">★</label>
          </div>

          <div class="rating-option">
            <input type="radio" id="rating2" name="rating" value="2">
            <label for="rating2">★★</label>
          </div>

          <div class="rating-option">
            <input type="radio" id="rating3" name="rating" value="3">
            <label for="rating3">★★★</label>
          </div>

          <div class="rating-option">
            <input type="radio" id="rating4" name="rating" value="4">
            <label for="rating4">★★★★</label>
            </div>

          <div class="rating-option">
            <input type="radio" id="rating5" name="rating" value="5">
            <label for="rating5">★★★★★</label>
          </div>
        </div>

        <label class="review-description">What features were most useful?</label>


          <label>
              <input type="checkbox" name="features" value="durability">
              Durability
          </label>

          <label>
              <input type="checkbox" name="features" value="durability">
              Ease of use
          </label>


          <label>
              <input type="checkbox" name="features" value="performance">
              Performance
          </label>

          <label>
              <input type="checkbox" name="features" value="price">
              Price
          </label>

          <label>
              <input type="checkbox" name="features" value="price">
              Ability to conquer enemies
          </label>



        <label class="review-description">Date Purchased:</label>
        <input type="date" id="date" name="date">

        <label class="review-description">Written Review (Optional)</label>
        <textarea id="review" name="review"></textarea>

        <label class="review-description">Name (Optional)</label>
        <input type="text" id="product" name="product">

        <input type="submit" value="Post Review">

    </form>

    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span> &#10070; Colby Orr &#10070; Idaho, United States
        </p>
        <p>
            lastModified <span id="lastModified"></span>
        </p>
    </footer>
</body>
</html>
